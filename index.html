<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homeroom Supabase Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      font-family:Arial,sans-serif;
      max-width:500px;
      margin:60px auto;
      padding:20px;
    }

    input,button{
      width:100%;
      padding:12px;
      margin:8px 0;
      font-size:16px;
    }

    #status{
      margin-top:20px;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>

<h1>Homeroom Test</h1>

<input
  id="email"
  type="email"
  placeholder="Email"
/>

<input
  id="password"
  type="password"
  placeholder="Password"
/>

<button id="signup">
  Create account
</button>

<button id="signin">
  Sign in
</button>

<button id="check">
  Check session
</button>

<div id="status">
  Starting...
</div>


<script>

const SUPABASE_URL =
  'https://vpevjppqdxvyiodhcusj.supabase.co';

const SUPABASE_KEY =
  'PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE';


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const status =
  document.getElementById('status');


status.textContent =
  'Supabase client created successfully.';


document
  .getElementById('signup')
  .onclick =
  async () => {

    status.textContent =
      'Creating account...';


    const email =
      document.getElementById('email').value;


    const password =
      document.getElementById('password').value;


    try{

      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({
          email,
          password
        });


      if(error){

        status.textContent =
          'ERROR:\n' +
          error.message;

        return;

      }


      status.textContent =
        'SUCCESS\n\n' +
        JSON.stringify(
          data,
          null,
          2
        );

    }

    catch(error){

      status.textContent =
        'NETWORK ERROR:\n' +
        error.message;

    }

  };


document
  .getElementById('signin')
  .onclick =
  async () => {

    status.textContent =
      'Signing in...';


    const email =
      document.getElementById('email').value;


    const password =
      document.getElementById('password').value;


    try{

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({
            email,
            password
          });


      if(error){

        status.textContent =
          'ERROR:\n' +
          error.message;

        return;

      }


      status.textContent =
        'SIGNED IN\n\n' +
        JSON.stringify(
          data,
          null,
          2
        );

    }

    catch(error){

      status.textContent =
        'NETWORK ERROR:\n' +
        error.message;

    }

  };


document
  .getElementById('check')
  .onclick =
  async () => {

    status.textContent =
      'Checking session...';


    try{

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .getSession();


      if(error){

        status.textContent =
          'ERROR:\n' +
          error.message;

        return;

      }


      status.textContent =
        'SESSION RESULT\n\n' +
        JSON.stringify(
          data,
          null,
          2
        );

    }

    catch(error){

      status.textContent =
        'NETWORK ERROR:\n' +
        error.message;

    }

  };

</script>

</body>
</html>
