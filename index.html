<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Homeroom — My Schedule</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* ---------- Design tokens ---------- */
  :root{
    --ink:#1C1B19;
    --ink-soft:#6B675D;
    --paper:#F5F3EE;
    --card:#FFFFFF;
    --paper-deep:#EDEAE1;
    --cork:#DCCBAE;
    --cork-dark:#C7B294;
    --line:#DBD5C6;
    --green:#1F3D2B;
    --green-light:#2C5940;
    --green-pale:#E4EBE3;
    --gold:#F2B705;
    --danger:#A83232;
    --danger-pale:#F3E0DE;
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:22px;
    --shadow-card:0 1px 2px rgba(28,27,25,.06),0 6px 16px rgba(28,27,25,.05);
    --shadow-note:0 10px 22px rgba(28,27,25,.20);
    --shadow-modal:0 20px 60px rgba(28,27,25,.35);
    --font-display:'Fraunces',serif;
    --font-body:'Inter',system-ui,sans-serif;
    --font-mono:'Space Mono',monospace;
  }

  /* Class accent colors — edit the CLASSES list in the script below to match, keep in sync */
  .c-chem{ --accent:#1F8A78; }
  .c-history{ --accent:#8C3A3A; }
  .c-seminar{ --accent:#6B4FA0; }
  .c-pe{ --accent:#D97B3F; }
  .c-cband{ --accent:#8A4F8C; }
  .c-jband{ --accent:#B98A22; }
  .c-alg2{ --accent:#3B6EA5; }
  .c-span3{ --accent:#B9583F; }
  .c-none{ --accent:#8A8578; }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:var(--font-display); margin:0; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--green); outline-offset:2px; }

  .wrap{ max-width:1120px; margin:0 auto; padding:0 24px; }

  /* ---------- Header ---------- */
  .app-header{
    position:sticky; top:0; z-index:40;
    background:var(--green);
    color:#F5F3EE;
    border-bottom:1px solid rgba(0,0,0,.15);
  }
  .app-header .wrap{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:18px; padding-bottom:18px; gap:16px;
  }
  .brand-title{ font-size:26px; font-weight:600; letter-spacing:.2px; }
  .brand-sub{
    font-family:var(--font-mono); font-size:12px; opacity:.75;
    margin-top:2px; text-transform:uppercase; letter-spacing:.08em;
  }
  .btn{
    border:none; border-radius:999px; padding:11px 18px;
    font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:8px;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn:active{ transform:translateY(0); }
  .btn-primary{ background:var(--gold); color:var(--ink); box-shadow:0 4px 12px rgba(0,0,0,.2); }
  .btn-primary:hover{ box-shadow:0 6px 16px rgba(0,0,0,.28); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-ghost:hover{ background:var(--paper-deep); }
  .btn-outline-light{ background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.35); }
  .btn-outline-light:hover{ background:rgba(255,255,255,.16); }
  .btn-small{ padding:7px 13px; font-size:13px; }
  .icon{ width:16px; height:16px; flex:none; }

  main{ padding-bottom:80px; }

  /* ---------- Section headings ---------- */
  .section{ margin-top:40px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .section-title{ font-size:22px; font-weight:600; }
  .section-note{ font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; }

  /* ---------- Deadlines corkboard ---------- */
  .corkboard{
    border-radius:var(--radius-lg);
    padding:26px 20px 22px;
    background:
      radial-gradient(circle at 12% 30%, rgba(0,0,0,.05) 0, transparent 3%),
      radial-gradient(circle at 68% 70%, rgba(0,0,0,.05) 0, transparent 3%),
      radial-gradient(circle at 40% 15%, rgba(0,0,0,.04) 0, transparent 2.5%),
      radial-gradient(circle at 85% 20%, rgba(0,0,0,.04) 0, transparent 2.5%),
      radial-gradient(circle at 25% 80%, rgba(0,0,0,.04) 0, transparent 2.5%),
      linear-gradient(135deg, var(--cork), var(--cork-dark));
    overflow-x:auto;
    overflow-y:visible;
  }
  .note-row{ display:flex; gap:22px; padding:6px 10px 14px; min-height:150px; }
  .sticky-note{
    flex:none; width:196px; min-height:150px;
    background:#FFFDF5;
    border-radius:4px;
    box-shadow:var(--shadow-note);
    padding:16px 14px 14px;
    position:relative;
    display:flex; flex-direction:column; gap:8px;
  }
  .note-row .sticky-note:nth-child(3n+1){ transform:rotate(-2.2deg); }
  .note-row .sticky-note:nth-child(3n+2){ transform:rotate(1.6deg); }
  .note-row .sticky-note:nth-child(3n){ transform:rotate(-1deg); }
  .sticky-note:hover{ transform:translateY(-3px) rotate(0deg); transition:transform .18s ease; z-index:5; }
  .sticky-note::before{
    content:''; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--accent, #A83232) 60%, rgba(0,0,0,.35));
    box-shadow:0 3px 4px rgba(0,0,0,.35);
  }
  .note-class{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent, var(--ink-soft)); font-weight:700; }
  .note-title{ font-family:var(--font-display); font-weight:600; font-size:16.5px; line-height:1.25; color:var(--ink); }
  .note-stamp{
    margin-top:auto; align-self:flex-start;
    font-family:var(--font-mono); font-size:11px; font-weight:700;
    padding:4px 9px; border-radius:999px; letter-spacing:.02em;
  }
  .stamp-urgent{ background:var(--danger); color:#fff; }
  .stamp-soon{ background:var(--gold); color:var(--ink); }
  .stamp-ok{ background:var(--green-pale); color:var(--green); }
  .empty-note{
    flex:none; width:100%; text-align:center; color:var(--ink-soft);
    background:rgba(255,253,245,.6); border:1.5px dashed var(--cork-dark);
    border-radius:var(--radius-md); padding:34px 20px; box-shadow:none;
  }
  .empty-note .note-title{ font-size:16px; color:var(--ink-soft); font-style:italic; }

  /* ---------- Classes grid ---------- */
  .classes-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;
  }
  .class-card{
    background:var(--card); border-radius:var(--radius-md);
    border-left:7px solid var(--accent);
    box-shadow:var(--shadow-card);
    padding:16px 16px 14px; text-align:left; border-top:none; border-right:none; border-bottom:none;
    display:flex; flex-direction:column; gap:6px; min-height:96px;
    transition:transform .15s ease, box-shadow .15s ease;
    width:100%;
  }
  .class-card:hover{ transform:translateY(-3px); box-shadow:0 10px 24px rgba(28,27,25,.12); }
  .class-name{ font-size:17px; font-weight:600; font-family:var(--font-display); color:var(--ink); }
  .class-meta{
    display:flex; align-items:center; justify-content:space-between; margin-top:auto;
    font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;
  }
  .pill-count{
    background:var(--paper-deep); color:var(--ink-soft); border-radius:999px;
    padding:3px 9px; font-weight:700;
  }
  .pill-count.has-items{ background:var(--accent); color:#fff; }

  /* ---------- Task list ---------- */
  .filter-tabs{ display:flex; gap:8px; flex-wrap:wrap; }
  .tab-btn{
    background:var(--paper-deep); color:var(--ink-soft); border:none; border-radius:999px;
    padding:8px 15px; font-size:13px; font-weight:600;
  }
  .tab-btn.active{ background:var(--green); color:#fff; }

  .task-list{ margin-top:16px; display:flex; flex-direction:column; gap:9px; }
  .task-row{
    background:var(--card); border-radius:var(--radius-sm); box-shadow:var(--shadow-card);
    padding:12px 14px; display:flex; align-items:center; gap:12px;
  }
  .task-row.done{ opacity:.55; }
  .check{
    width:21px; height:21px; border-radius:50%; border:2px solid var(--line); flex:none;
    display:flex; align-items:center; justify-content:center; background:#fff; padding:0;
  }
  .check svg{ width:12px; height:12px; opacity:0; transition:opacity .1s; }
  .task-row.done .check{ background:var(--green); border-color:var(--green); }
  .task-row.done .check svg{ opacity:1; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none; }
  .task-main{ flex:1; min-width:0; }
  .task-title{ font-weight:600; font-size:14.5px; }
  .task-row.done .task-title{ text-decoration:line-through; }
  .task-meta{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); margin-top:2px; text-transform:uppercase; letter-spacing:.03em; }
  .type-badge{
    font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em;
    padding:2px 7px; border-radius:5px; background:var(--paper-deep); color:var(--ink-soft); font-weight:700;
  }
  .icon-btn{
    background:transparent; border:none; color:var(--ink-soft); width:30px; height:30px;
    border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .icon-btn:hover{ background:var(--danger-pale); color:var(--danger); }
  .empty-state{
    text-align:center; padding:38px 20px; color:var(--ink-soft);
    background:var(--card); border-radius:var(--radius-md); border:1.5px dashed var(--line);
  }
  .empty-state strong{ display:block; font-family:var(--font-display); font-size:17px; color:var(--ink); margin-bottom:4px; font-weight:600; }

  /* ---------- Modals ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(28,27,25,.55); backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow-modal);
    width:100%; max-width:460px; max-height:88vh; overflow-y:auto;
    padding:26px 26px 22px; position:relative;
  }
  .modal-close{
    position:absolute; top:16px; right:16px; background:var(--paper-deep); border:none;
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
  }
  .modal-close:hover{ background:var(--line); }
  .modal-title{ font-size:21px; font-weight:600; padding-right:30px; }
  .modal-accent-bar{ height:6px; border-radius:999px; background:var(--accent); width:52px; margin-top:8px; margin-bottom:18px; }

  .field{ margin-bottom:15px; }
  .field label{
    display:block; font-family:var(--font-mono); font-size:11px; text-transform:uppercase;
    letter-spacing:.06em; color:var(--ink-soft); margin-bottom:6px; font-weight:700;
  }
  .field input[type=text],
  .field input[type=date],
  .field input[type=time],
  .field select,
  .field textarea{
    width:100%; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    padding:10px 12px; font-size:14.5px; background:var(--paper); color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:64px; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .type-toggle{ display:flex; gap:8px; }
  .type-toggle button{
    flex:1; border:1.5px solid var(--line); background:var(--paper); border-radius:var(--radius-sm);
    padding:9px 6px; font-size:13px; font-weight:600; color:var(--ink-soft);
  }
  .type-toggle button.active{ border-color:var(--green); background:var(--green-pale); color:var(--green); }
  .form-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:6px; }

  /* Class modal tabs */
  .cm-tabs{ display:flex; gap:18px; border-bottom:1.5px solid var(--line); margin-bottom:14px; }
  .cm-tab{
    background:none; border:none; padding:8px 2px 10px; font-weight:600; font-size:14px;
    color:var(--ink-soft); border-bottom:2.5px solid transparent; margin-bottom:-1.5px;
  }
  .cm-tab.active{ color:var(--ink); border-bottom-color:var(--accent); }
  .cm-list{ display:flex; flex-direction:column; gap:8px; max-height:44vh; overflow-y:auto; padding-right:2px; }
  .cm-add-btn{ width:100%; margin-top:16px; justify-content:center; background:var(--accent); color:#fff; }

  footer{ text-align:center; padding:30px 20px 40px; color:var(--ink-soft); font-family:var(--font-mono); font-size:11.5px; }

  @media (max-width:640px){
    .brand-title{ font-size:22px; }
    .wrap{ padding:0 16px; }
    .btn span.btn-label{ display:none; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="wrap">
    <div>
      <div class="brand-title">Homeroom</div>
      <div class="brand-sub" id="todayLabel">—</div>
    </div>
    <button class="btn btn-primary" id="openAddBtn">
      <svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span class="btn-label">Add</span>
    </button>
  </div>
</header>

<main class="wrap">

  <section class="section" id="deadlinesSection">
    <div class="section-head">
      <h2 class="section-title">Upcoming Deadlines</h2>
      <div class="section-note">Next 7 days</div>
    </div>
    <div class="corkboard">
      <div class="note-row" id="deadlinesRow"></div>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2 class="section-title">Your Classes</h2>
      <div class="section-note">Tap a class for that day's homework</div>
    </div>
    <div class="classes-grid" id="classesGrid"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2 class="section-title">Everything</h2>
      <div class="filter-tabs" id="filterTabs">
        <button class="tab-btn active" data-filter="all">All</button>
        <button class="tab-btn" data-filter="homework">Homework</button>
        <button class="tab-btn" data-filter="deadline">Deadlines</button>
        <button class="tab-btn" data-filter="reminder">Reminders</button>
      </div>
    </div>
    <div class="task-list" id="taskList"></div>
  </section>

</main>

<footer>Built for your own binder — everything saves right in this browser.</footer>

<!-- Add / Edit Task Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal-box">
    <button class="modal-close" id="closeAddModal" aria-label="Close">
      <svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <h3 class="modal-title">Add to your planner</h3>
    <div class="modal-accent-bar" style="background:var(--green)"></div>
    <form id="taskForm">
      <div class="field">
        <label>Type</label>
        <div class="type-toggle" id="typeToggle">
          <button type="button" class="active" data-type="homework">Homework</button>
          <button type="button" data-type="deadline">Deadline</button>
          <button type="button" data-type="reminder">Reminder</button>
        </div>
      </div>
      <div class="field">
        <label for="f-class">Class</label>
        <select id="f-class">
          <option value="">No class / general</option>
        </select>
      </div>
      <div class="field">
        <label for="f-title">Title</label>
        <input type="text" id="f-title" placeholder="e.g. Read Ch. 7 &amp; answer questions 1-5" required />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-date">Due date</label>
          <input type="date" id="f-date" required />
        </div>
        <div class="field">
          <label for="f-time">Time <span style="text-transform:none;font-weight:400;">(optional)</span></label>
          <input type="time" id="f-time" />
        </div>
      </div>
      <div class="field">
        <label for="f-notes">Notes <span style="text-transform:none;font-weight:400;">(optional)</span></label>
        <textarea id="f-notes" placeholder="Any extra details..."></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelAddBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Class Detail Modal -->
<div class="modal-overlay" id="classModal">
  <div class="modal-box">
    <button class="modal-close" id="closeClassModal" aria-label="Close">
      <svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <h3 class="modal-title" id="cmTitle">Class</h3>
    <div class="modal-accent-bar" id="cmAccentBar"></div>
    <div class="cm-tabs">
      <button class="cm-tab active" data-tab="today">Today</button>
      <button class="cm-tab" data-tab="upcoming">Upcoming</button>
    </div>
    <div class="cm-list" id="cmList"></div>
    <button class="btn cm-add-btn" id="cmAddBtn">
      <svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      Add homework for this class
    </button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- Config: your classes ---------- */
  const CLASSES = [
    { id:'chem',    name:'Chemistry',              cls:'c-chem'    },
    { id:'history', name:'AP Modern World History', cls:'c-history' },
    { id:'seminar', name:'AP Seminar',              cls:'c-seminar' },
    { id:'pe',      name:'PE',                      cls:'c-pe'      },
    { id:'cband',   name:'Concert Band',            cls:'c-cband'   },
    { id:'jband',   name:'Jazz Band',                cls:'c-jband'  },
    { id:'alg2',    name:'Algebra 2',                cls:'c-alg2'   },
    { id:'span3',   name:'Spanish 3',                cls:'c-span3'  },
  ];
  const classById = id => CLASSES.find(c => c.id === id);

  const STORAGE_KEY = 'homeroom-tasks-v1';

  /* ---------- State ---------- */
  let tasks = loadTasks();
  let activeFilter = 'all';
  let activeType = 'homework';
  let classModalId = null;
  let classModalTab = 'today';

  /* ---------- Storage ---------- */
  function loadTasks(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveTasks(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  /* ---------- Date helpers ---------- */
  function pad(n){ return String(n).padStart(2,'0'); }
  function todayStr(){
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }
  function parseLocalDate(str){
    const [y,m,d] = str.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function daysBetween(fromStr, toStr){
    const a = parseLocalDate(fromStr), b = parseLocalDate(toStr);
    return Math.round((b - a) / 86400000);
  }
  function formatDateNice(str){
    const d = parseLocalDate(str);
    return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  }
  function formatTimeNice(t){
    if(!t) return '';
    const [h,m] = t.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h12 = ((h+11)%12)+1;
    return `${h12}:${pad(m)} ${ampm}`;
  }

  /* ---------- Populate static UI ---------- */
  function initHeader(){
    const d = new Date();
    document.getElementById('todayLabel').textContent =
      d.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
  }

  function initClassSelect(){
    const sel = document.getElementById('f-class');
    CLASSES.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      sel.appendChild(opt);
    });
  }

  function renderClasses(){
    const grid = document.getElementById('classesGrid');
    grid.innerHTML = '';
    CLASSES.forEach(c => {
      const pending = tasks.filter(t => t.classId === c.id && !t.done && (t.type==='homework'||t.type==='deadline')).length;
      const btn = document.createElement('button');
      btn.className = `class-card ${c.cls}`;
      btn.innerHTML = `
        <div class="class-name">${escapeHtml(c.name)}</div>
        <div class="class-meta">
          <span>View homework</span>
          <span class="pill-count ${pending>0?'has-items':''}">${pending} pending</span>
        </div>`;
      btn.addEventListener('click', () => openClassModal(c.id));
      grid.appendChild(btn);
    });
  }

  /* ---------- Deadlines rail ---------- */
  function renderDeadlines(){
    const row = document.getElementById('deadlinesRow');
    row.innerHTML = '';
    const today = todayStr();
    const upcoming = tasks
      .filter(t => t.type === 'deadline' && !t.done)
      .map(t => ({ ...t, delta: daysBetween(today, t.date) }))
      .filter(t => t.delta >= 0 && t.delta <= 7)
      .sort((a,b) => a.delta - b.delta);

    if(upcoming.length === 0){
      row.innerHTML = `
        <div class="empty-note">
          <div class="note-title">No upcoming deadlines</div>
          <div style="font-family:var(--font-mono);font-size:12px;margin-top:4px;">You're clear for the next 7 days.</div>
        </div>`;
      return;
    }

    upcoming.forEach(t => {
      const c = t.classId ? classById(t.classId) : null;
      const note = document.createElement('div');
      note.className = `sticky-note ${c ? c.cls : 'c-none'}`;
      let stampClass = 'stamp-ok', stampText = `Due in ${t.delta} days`;
      if(t.delta === 0){ stampClass='stamp-urgent'; stampText='Due today'; }
      else if(t.delta === 1){ stampClass='stamp-urgent'; stampText='Due tomorrow'; }
      else if(t.delta <= 3){ stampClass='stamp-soon'; stampText=`Due in ${t.delta} days`; }
      note.innerHTML = `
        <div class="note-class">${c ? escapeHtml(c.name) : 'General'}</div>
        <div class="note-title">${escapeHtml(t.title)}</div>
        <div class="note-stamp ${stampClass}">${stampText}</div>`;
      row.appendChild(note);
    });
  }

  /* ---------- Everything list ---------- */
  function renderTaskList(){
    const list = document.getElementById('taskList');
    list.innerHTML = '';
    let items = [...tasks];
    if(activeFilter !== 'all') items = items.filter(t => t.type === activeFilter);
    items.sort((a,b) => {
      if(a.done !== b.done) return a.done ? 1 : -1;
      return (a.date||'').localeCompare(b.date||'');
    });

    if(items.length === 0){
      list.innerHTML = `
        <div class="empty-state">
          <strong>Nothing here yet</strong>
          Add homework, a deadline, or a reminder to get started.
        </div>`;
      return;
    }

    items.forEach(t => list.appendChild(renderTaskRow(t)));
  }

  function renderTaskRow(t){
    const c = t.classId ? classById(t.classId) : null;
    const row = document.createElement('div');
    row.className = `task-row ${c ? c.cls : 'c-none'} ${t.done ? 'done' : ''}`;
    const metaParts = [];
    if(c) metaParts.push(c.name);
    if(t.date) metaParts.push(formatDateNice(t.date));
    if(t.time) metaParts.push(formatTimeNice(t.time));

    row.innerHTML = `
      <button class="check" aria-label="Mark complete">
        <svg viewBox="0 0 14 14" fill="none"><path d="M2 7l3.5 3.5L12 3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="dot"></span>
      <div class="task-main">
        <div class="task-title">${escapeHtml(t.title)}</div>
        <div class="task-meta">${escapeHtml(metaParts.join(' · '))} <span class="type-badge">${t.type}</span></div>
      </div>
      <button class="icon-btn" aria-label="Delete">
        <svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>`;

    row.querySelector('.check').addEventListener('click', () => toggleDone(t.id));
    row.querySelector('.icon-btn').addEventListener('click', () => deleteTask(t.id));
    return row;
  }

  function toggleDone(id){
    const t = tasks.find(x => x.id === id);
    if(t){ t.done = !t.done; saveTasks(); renderAll(); }
  }
  function deleteTask(id){
    tasks = tasks.filter(x => x.id !== id);
    saveTasks(); renderAll();
  }

  /* ---------- Filter tabs ---------- */
  document.getElementById('filterTabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if(!btn) return;
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('#filterTabs .tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    renderTaskList();
  });

  /* ---------- Add modal ---------- */
  const addModal = document.getElementById('addModal');
  function openAddModal(presetClassId, presetType){
    document.getElementById('taskForm').reset();
    activeType = presetType || 'homework';
    document.querySelectorAll('#typeToggle button').forEach(b => b.classList.toggle('active', b.dataset.type === activeType));
    document.getElementById('f-class').value = presetClassId || '';
    document.getElementById('f-date').value = todayStr();
    addModal.classList.add('open');
    document.getElementById('f-title').focus();
  }
  function closeAddModal(){ addModal.classList.remove('open'); }

  document.getElementById('openAddBtn').addEventListener('click', () => openAddModal());
  document.getElementById('closeAddModal').addEventListener('click', closeAddModal);
  document.getElementById('cancelAddBtn').addEventListener('click', closeAddModal);
  addModal.addEventListener('click', e => { if(e.target === addModal) closeAddModal(); });

  document.getElementById('typeToggle').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    activeType = btn.dataset.type;
    document.querySelectorAll('#typeToggle button').forEach(b => b.classList.toggle('active', b === btn));
  });

  document.getElementById('taskForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = document.getElementById('f-title').value.trim();
    const date = document.getElementById('f-date').value;
    if(!title || !date) return;
    tasks.push({
      id: 't' + Date.now() + Math.random().toString(16).slice(2),
      type: activeType,
      classId: document.getElementById('f-class').value || null,
      title,
      date,
      time: document.getElementById('f-time').value || '',
      notes: document.getElementById('f-notes').value.trim(),
      done: false,
      createdAt: Date.now(),
    });
    saveTasks();
    closeAddModal();
    renderAll();
  });

  /* ---------- Class modal ---------- */
  const classModal = document.getElementById('classModal');
  function openClassModal(classId){
    classModalId = classId;
    classModalTab = 'today';
    document.querySelectorAll('.cm-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === 'today'));
    renderClassModal();
    classModal.classList.add('open');
  }
  function closeClassModal(){ classModal.classList.remove('open'); classModalId = null; }
  document.getElementById('closeClassModal').addEventListener('click', closeClassModal);
  classModal.addEventListener('click', e => { if(e.target === classModal) closeClassModal(); });

  document.querySelectorAll('.cm-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      classModalTab = tab.dataset.tab;
      document.querySelectorAll('.cm-tab').forEach(b => b.classList.toggle('active', b === tab));
      renderClassModal();
    });
  });

  document.getElementById('cmAddBtn').addEventListener('click', () => {
    if(!classModalId) return;
    closeClassModal();
    openAddModal(classModalId, 'homework');
  });

  function renderClassModal(){
    if(!classModalId) return;
    const c = classById(classModalId);
    document.getElementById('cmTitle').textContent = c.name;
    document.getElementById('cmAccentBar').className = `modal-accent-bar ${c.cls}`;
    document.getElementById('cmAccentBar').style.background = 'var(--accent)';

    const list = document.getElementById('cmList');
    list.innerHTML = '';
    const today = todayStr();
    let items = tasks.filter(t => t.classId === classModalId && (t.type==='homework' || t.type==='deadline'));

    if(classModalTab === 'today'){
      items = items.filter(t => t.date === today);
    }else{
      items = items.filter(t => !t.done && t.date >= today);
      items.sort((a,b) => a.date.localeCompare(b.date));
    }

    if(items.length === 0){
      list.innerHTML = `
        <div class="empty-state">
          <strong>${classModalTab === 'today' ? 'Nothing due today' : 'Nothing coming up'}</strong>
          Add the first assignment for ${escapeHtml(c.name)}.
        </div>`;
      return;
    }
    items.forEach(t => list.appendChild(renderTaskRow(t)));
  }

  /* ---------- Utils ---------- */
  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }

  /* ---------- Keyboard ---------- */
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ closeAddModal(); closeClassModal(); }
  });

  /* ---------- Render everything ---------- */
  function renderAll(){
    renderDeadlines();
    renderClasses();
    renderTaskList();
    if(classModalId) renderClassModal();
  }

  initHeader();
  initClassSelect();
  renderAll();
})();
</script>
</body>
</html>
